<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e87a21"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>RUTA EXPRESS® · COMERCIAL MÓVIL PRO</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f5f7;color:#24394a}.top{background:white;box-shadow:0 2px 12px #182b3a22;padding:13px 16px;display:flex;align-items:center;gap:12px}.top img{width:52px;height:52px;object-fit:contain}.top strong{display:block;font-size:17px}.top small{color:#5e6d7a;font-size:11px}.menu{max-width:580px;margin:25px auto;padding:0 20px;text-align:center}.menu h1{font-size:23px;margin:12px 0 4px}.menu p{font-size:13px;color:#617180}.btn{display:block;width:100%;padding:19px;border:0;border-radius:12px;background:linear-gradient(#f79a43,#d96b14);color:#fff;font-size:18px;font-weight:800;margin:15px 0;box-shadow:0 4px 9px #b65d1833;cursor:pointer}.back{border:1px solid #adb7bf;background:linear-gradient(#f7f8f9,#c8d0d7);padding:8px 13px;border-radius:9px;font-size:15px;font-weight:700;color:#d46a15;cursor:pointer}.module{display:none;height:100dvh;flex-direction:column}.module-head{padding:7px 10px;background:#e9edf0;display:flex;align-items:center;gap:12px;border-bottom:1px solid #bdc6cc}.module-head b{font-size:14px}iframe{border:0;width:100%;flex:1;min-height:0;background:white}.foot{margin-top:26px;font-size:12px;color:#657584}</style></head><body><div id="home"><header class="top"><img src="logo.png" alt="Logo RUTA EXPRESS"><div><strong>RUTA EXPRESS®</strong><small>LOGÍSTICA Y TRASLADO</small></div></header><main class="menu"><h1>COMERCIAL MÓVIL PRO</h1><p>Traslado seguro y confianza en cada entrega</p><button class="btn" onclick="openModule('clientes')">CLIENTES</button><button class="btn" onclick="openModule('cotizaciones')">COTIZACIONES</button><div class="foot">Menú principal · RUTA EXPRESS®</div></main></div><div class="module" id="module"><div class="module-head"><button class="back" onclick="goHome()" aria-label="Regresar al menú">❮ MENÚ</button><b id="moduleName"></b></div><iframe id="moduleFrame" title="Módulo RUTA EXPRESS" allow="microphone; clipboard-write"></iframe></div><script>function openModule(name){if(!['clientes','cotizaciones'].includes(name))return;document.getElementById('home').style.display='none';document.getElementById('module').style.display='flex';document.getElementById('moduleName').textContent=name.toUpperCase();document.getElementById('moduleFrame').src=name+'.html';history.pushState({module:name},'', '#'+name)}function goHome(){document.getElementById('moduleFrame').src='about:blank';document.getElementById('module').style.display='none';document.getElementById('home').style.display='block';if(location.hash)history.replaceState(null,'',location.pathname+location.search)}window.addEventListener('popstate',()=>{if(location.hash){let n=location.hash.slice(1);if(['clientes','cotizaciones'].includes(n))openModule(n)}else goHome()});if(['#clientes','#cotizaciones'].includes(location.hash))openModule(location.hash.slice(1));</script></body></html>
